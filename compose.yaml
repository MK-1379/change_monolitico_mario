services:

  app:
    build: .
    image: mk1379/change-monolitico:v2
    ports:
      - "8001:80"
    env_file: .env
    volumes:
      - fotos-peticiones:/var/www/html/public/peticiones
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - datos-change-mono:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

volumes:
  datos-change-mono:
  fotos-peticiones:
